name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan, level max)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        db: [sqlite, mysql, pgsql]
        include:
          - db: sqlite
            db_host: ''
            db_port: ''
            db_database: ':memory:'
            db_username: ''
            db_password: ''
          - db: mysql
            db_host: 127.0.0.1
            db_port: '3306'
            db_database: ledger_test
            db_username: root
            db_password: root
          - db: pgsql
            db_host: 127.0.0.1
            db_port: '5432'
            db_database: ledger_test
            db_username: postgres
            db_password: postgres

    # Both servers start for every job; each job only talks to the one in matrix.db.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ledger_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_DATABASE: ${{ matrix.db_database }}
      DB_USERNAME: ${{ matrix.db_username }}
      DB_PASSWORD: ${{ matrix.db_password }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, mbstring, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run migrations against ${{ matrix.db }}
        if: matrix.db != 'sqlite'
        run: php artisan migrate --force --no-interaction
        env:
          APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=

      - name: Run the test suite
        run: vendor/bin/phpunit
